<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaurav Sharma - Resume</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" id="resume"></div>
  <script>
    const renderers = {
      text: s => `<p>${s.content}</p>`,
      tags: s => `<div class="skills">${s.items.map(t => typeof t === 'string' ? `<span class="tag">${t}</span>` : `<span class="tag${t.tip ? ' tooltip" data-tip="' + t.tip : ''}">${t.name}</span>`).join('')}</div>`,
      experience: s => s.items.map(e => `
        <div class="entry">
          <div class="entry-header">
            <strong>${e.role} — ${e.company}</strong>
            <span>${e.period}</span>
          </div>
          <ul>${e.highlights.map(h => `<li>${h.id ? `<a href="detail.html?id=${h.id}">${h.text}</a>` : h.text}</li>`).join('')}</ul>
        </div>`).join(''),
      education: s => s.items.map(e => `
        <div class="entry">
          <div class="entry-header">
            <strong>${e.degree} — ${e.institution}</strong>
            <span>${e.period}</span>
          </div>
        </div>`).join(''),
      projects: s => s.items.map(p => `
        <div class="entry">
          <div class="entry-header">
            <strong>${p.url ? `<a href="${p.url}">${p.name}</a>` : p.name}</strong>
          </div>
          <p>${p.description}</p>
        </div>`).join(''),
      list: s => `<ul>${s.items.map(i => `<li>${i}</li>`).join('')}</ul>`,
      contributions: s => s.items.map(c => `
        <div class="entry">
          <div class="entry-header">
            <strong>${c.url ? `<a href="${c.url}">${c.project}</a>` : c.project}</strong>
          </div>
          <p>${c.description}</p>
          <ul>${c.commits.map(cm => `<li>${cm.url ? `<a href="${cm.url}">${cm.text}</a>` : cm.text}</li>`).join('')}</ul>
        </div>`).join('')
    };

    fetch('data.json').then(r => r.json()).then(d => {
      document.title = `${d.name} - Resume`;
      const c = d.contact;
      document.getElementById('resume').innerHTML = `
        <header>
          <h1>${d.name}</h1>
          <p class="subtitle">${d.title}</p>
          <nav class="contact">
            ${[
              c.email ? `<a href="mailto:${c.email}">${c.email}</a>` : '',
              c.github ? `<a href="${c.github}">GitHub</a>` : '',
              c.linkedin ? `<a href="${c.linkedin}">LinkedIn</a>` : '',
              c.location ? `<span>${c.location}</span>` : ''
            ].filter(Boolean).join('<span>|</span>')}
          </nav>
        </header>
        ${d.sections.map(s => `<section><h2>${s.title}</h2>${(renderers[s.type] || renderers.text)(s)}</section>`).join('')}`;
      window.scrollTo(0, sessionStorage.getItem('scrollY') || 0);
    });
    window.addEventListener('beforeunload', () => sessionStorage.setItem('scrollY', window.scrollY));
  </script>
</body>
</html>
