<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" id="detail"></div>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    fetch('details.json').then(r => r.json()).then(d => {
      const item = d[id];
      if (!item) {
        document.getElementById('detail').innerHTML = '<p>Not found.</p><a href="index.html">← Back to resume</a>';
        return;
      }
      document.title = item.title;
      document.getElementById('detail').innerHTML = `
        <a href="index.html" class="back-link">← Back to resume</a>
        <header>
          <h1>${item.title}</h1>
          <p class="subtitle">${item.company} · ${item.period}</p>
        </header>
        <section>
          <p>${item.description}</p>
          <ul>${item.details.map(d => `<li>${d}</li>`).join('')}</ul>
        </section>
        <section>
          <h2>Technologies</h2>
          <div class="skills">${item.technologies.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        </section>`;
    });
  </script>
</body>
</html>
